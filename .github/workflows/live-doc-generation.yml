# Authored by big-pickle (opencode/big-pickle) - AI-generated
name: Live Doc Generation

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changes from last 24 hours
        id: changes
        run: .github/scripts/check_commits.sh
        shell: bash

      - name: Generate diff
        if: steps.changes.outputs.has_changes == 'true'
        run: .github/scripts/generate_diff.sh
        shell: bash

      - name: Generate documentation with Gemini
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: .github/scripts/generate_docs.sh
        shell: bash

      - name: Apply generated documentation
        if: steps.changes.outputs.has_changes == 'true'
        run: .github/scripts/apply_docs.sh
        shell: bash

      - name: Commit documentation updates
        if: steps.changes.outputs.has_changes == 'true'
        run: .github/scripts/commit_docs.sh
        shell: bash
